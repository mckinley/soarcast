name: Set health alert recipient

# One-off: copies the SoarCast account's email (the only user) into the
# HEALTH_ALERT_TO Worker secret without printing it, so the address stays
# out of this public repo and its logs.
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set HEALTH_ALERT_TO from the account email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7c0ef4ee4d820ffe791557c534882957
        run: |
          users=$(npx wrangler d1 execute soarcast --remote --json --command "SELECT COUNT(*) AS n FROM user" | jq '.[0].results[0].n')
          echo "users: $users"
          test "$users" = 1
          email=$(npx wrangler d1 execute soarcast --remote --json --command "SELECT email FROM user LIMIT 1" | jq -r '.[0].results[0].email')
          echo "::add-mask::$email"
          echo "email sha256 prefix: $(printf %s "$email" | sha256sum | cut -c1-12)"
          printf %s "$email" | npx wrangler secret put HEALTH_ALERT_TO
