name: Health

# Prints the live health report (the checks the hourly cron runs), so it can
# be read without the CRON_SECRET. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health report
        run: |
          curl -sS -w '\nHTTP %{http_code}\n' -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://soarcast.mckinleyaviation.com/api/admin/health
