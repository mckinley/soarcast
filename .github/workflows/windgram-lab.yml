name: Windgram lab

# Captures real Open-Meteo responses for windgram reference sites and
# publishes them to refs/windgram-lab/latest:
#   git fetch origin +refs/windgram-lab/latest:refs/windgram-lab/latest

on:
  push:
    branches: ['claude/better-windgrams-2ee7ll']
    paths: ['scripts/windgram-lab/**', '.github/workflows/windgram-lab.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windgram-lab
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/windgram-lab/capture.mjs windgram-lab-out
      - name: Publish to refs/windgram-lab/latest
        if: always()
        run: |
          mkdir -p windgram-lab-out
          cd windgram-lab-out
          git init -q -b lab
          git add -A
          git -c user.name='windgram-lab' -c user.email='actions@users.noreply.github.com' \
            commit -qm "Windgram lab capture of ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/windgram-lab/latest
