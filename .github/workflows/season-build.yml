name: Season build

# The season build runs on Cloudflare: a Workflow in the soarcast-jobs
# Worker (jobs/season-build.ts), started twice a day by that Worker's cron.
# This starts one by hand and prints how it went, step by step. Plain
# automation, no AI.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rate a few destinations and write nothing'
        type: boolean
        default: false
      limit:
        description: 'Build at most this many sites (empty: every site due)'
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Start the build on Cloudflare and follow it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/season-build/instances"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id="github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          params=$(jq -nc --arg dry "$DRY_RUN" --arg limit "$LIMIT" \
            '{dryRun: ($dry == "true")} + (if $limit == "" then {} else {limit: ($limit | tonumber)} end)')
          body=$(jq -nc --arg id "$id" --argjson params "$params" '{instance_id: $id, params: $params}')
          curl -sS -X POST -H "$auth" -H 'content-type: application/json' -d "$body" "$api" > started.json
          jq -c '{success, errors, id: .result.id}' started.json
          jq -e '.success' started.json > /dev/null

          shown=0
          while true; do
            sleep 30
            curl -sS -H "$auth" "$api/$id" > instance.json
            # Each finished step once: the plan's counts, each cell's lines, the run's record
            jq -r --argjson from "$shown" '
              [.result.steps[]? | select(.type == "step" and .end != null)] | .[$from:][] |
              if .name == "plan" then "plan: \(.output.sites) sites, \(.output.due) due"
              elif .name == "record" then "run: \(.output | tostring)"
              elif .success then (.output.lines // [] | .[])
              else "\(.name): failed, \(.error // .attempts[-1].error // {} | tostring)" end
            ' instance.json
            shown=$(jq '[.result.steps[]? | select(.type == "step" and .end != null)] | length' instance.json)
            status=$(jq -r '.result.status' instance.json)
            case "$status" in
              complete) exit 0 ;;
              errored|terminated|unknown|null)
                echo "The build ended: $status"
                jq -c '.result.error // .errors' instance.json
                exit 1 ;;
            esac
          done
