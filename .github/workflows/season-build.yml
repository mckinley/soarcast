name: Season build

# Rates the last 20 years of days at every followed and custom site and the
# destinations in src/lib/destinations.ts from ERA5, the record of past
# weather on Open-Meteo's open copy on Amazon, and writes them to
# site_seasons for site pages and the Planning page
# (scripts/seasons/build.ts). Each run builds what it can in its time and
# the next run carries on. Plain automation, no AI.

on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to spend (about half a minute a site)'
        default: '75'
      dry_run:
        description: 'Rate a few destinations and write nothing (to try a branch)'
        type: boolean
        default: false

concurrency:
  group: season-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build seasons
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASON_MINUTES: ${{ inputs.minutes || '75' }}
          # A dry run tries a few destinations without writing
          SEASON_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SEASON_LIMIT: ${{ inputs.dry_run && '4' || '' }}
        run: |
          npx esbuild scripts/seasons/build.ts --bundle --platform=node --format=esm '--external:@openmeteo/*' --outfile=season-tmp/build.mjs
          node season-tmp/build.mjs
