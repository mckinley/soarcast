name: Model verification pull

# Pulls day-ahead forecasts (Open-Meteo Previous Runs API) from many models at
# airports near flying sites, for scoring models against METARs. Runs here
# because Open-Meteo rate-limits the shared IPs of Claude's sandbox. Results:
#   git fetch origin +refs/model-verify/latest:refs/model-verify/latest

on:
  push:
    branches: ['claude/forecast-accuracy-1hi2gc']
    paths: ['scripts/verify/**', '.github/workflows/model-verify.yml']
  workflow_dispatch:
    inputs:
      set:
        description: 'Which seasons to pull: dry (flying seasons) or wet (rainy seasons)'
        default: dry
        type: choice
        options: [dry, wet]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull forecasts
        env:
          VERIFY_OUT: verify-out
          VERIFY_SET: ${{ inputs.set || 'dry' }}
        run: |
          mkdir -p verify-out
          cd scripts/verify && VERIFY_OUT=../../verify-out python3 pull_forecasts.py
      - name: Publish to refs/model-verify/latest
        if: always()
        run: |
          cd verify-out
          rm -rf cache
          gzip -f forecasts.json || true
          git init -q -b data
          git add -A
          git -c user.name='model-verify' -c user.email='actions@users.noreply.github.com' \
            commit -qm "Model verification pull of ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/model-verify/latest
