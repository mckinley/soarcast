name: Send Notifications

on:
  schedule:
    - cron: '0 6,18 * * *' # 6am and 6pm UTC daily
  workflow_dispatch: # manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification check
        run: |
          # The public URL, not a secret: the old SOARCAST_URL pointed at a
          # hostname that no longer serves the Worker, so every run got a 404.
          curl -X POST "https://soarcast.mckinleyaviation.com/api/notifications/check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail
