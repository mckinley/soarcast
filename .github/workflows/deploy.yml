name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # New files in migrations/ only; wrangler records applied ones in d1_migrations.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply soarcast --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The forecast pages depend on Open-Meteo answering the Worker; check
      # the live profile API end to end so a rejected request shows up here.
      - name: Smoke test the forecast API
        run: |
          sleep 20
          url="https://soarcast.mckinleyaviation.com/api/weather/profile?lat=47.49&lng=-121.79&days=1"
          status=$(curl -sS -o body.json -w '%{http_code}' "$url")
          echo "HTTP $status"
          head -c 600 body.json; echo
          test "$status" = 200
          grep -q '"sunriseByDay"' body.json

      # A site page must render a verdict, not "Error loading forecast".
      - name: Smoke test a site page
        run: |
          status=$(curl -sS -o page.html -w '%{http_code}' "https://soarcast.mckinleyaviation.com/sites/tiger-mountain")
          echo "HTTP $status"
          grep -oE '>(Flyable|Marginal|Not flyable)[^<]{0,100}' page.html | head -3 || true
          test "$status" = 200
          if grep -q 'Error loading forecast' page.html; then echo "The page shows Error loading forecast"; exit 1; fi
          grep -qE '>(Flyable|Marginal|Not flyable)' page.html

      # Starting a sign-in writes to the database, so this catches a broken
      # database as well as a missing OAuth client id. Google is printed only.
      - name: Smoke test sign-in
        run: |
          for provider in github google; do
            curl -sS -o "signin-$provider.json" -w "%{http_code}" -X POST \
              -H 'content-type: application/json' -H 'origin: https://soarcast.mckinleyaviation.com' \
              -d "{\"provider\":\"$provider\",\"callbackURL\":\"/dashboard\"}" \
              https://soarcast.mckinleyaviation.com/api/auth/sign-in/social > "status-$provider.txt"
            echo "$provider: HTTP $(cat status-$provider.txt)"
            head -c 300 "signin-$provider.json"; echo
          done
          test "$(cat status-github.txt)" = 200
          grep -q 'github.com/login/oauth/authorize?' signin-github.json
          if grep -qE 'client_id=(undefined)?&' signin-github.json; then echo "No GitHub client id"; exit 1; fi
