name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # New files in migrations/ only; wrangler records applied ones in d1_migrations.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply soarcast --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The forecast pages depend on Open-Meteo answering the Worker; check
      # the live profile API end to end so a rejected request shows up here.
      - name: Smoke test the forecast API
        run: |
          sleep 20
          url="https://soarcast.mckinleyaviation.com/api/weather/profile?lat=47.49&lng=-121.79&days=1"
          status=$(curl -sS -o body.json -w '%{http_code}' "$url")
          echo "HTTP $status"
          head -c 600 body.json; echo
          test "$status" = 200
          grep -q '"sunriseByDay"' body.json

      # A site page must render a verdict, not "Forecast unavailable".
      - name: Smoke test a site page
        run: |
          status=$(curl -sS -o page.html -w '%{http_code}' "https://soarcast.mckinleyaviation.com/sites/tiger-mountain")
          echo "HTTP $status"
          grep -oE '>(Launch window|Marginal|Not flyable)[^<]{0,100}' page.html | head -3 || true
          test "$status" = 200
          if grep -q 'Forecast unavailable' page.html; then echo "The page shows Forecast unavailable"; exit 1; fi
          grep -qE '>(Launch window|Marginal|Not flyable)' page.html

      # Adding your own site reads the terrain at the pin. Mount Rainier's
      # summit must come back above 4,000 m with a steep face. Listed launches
      # near North Bend are printed next to the terrain's suggestion, to
      # compare the suggested directions with real launches.
      - name: Smoke test the terrain lookup
        run: |
          api=https://soarcast.mckinleyaviation.com
          status=$(curl -sS -o rainier.json -w '%{http_code}' "$api/api/terrain?lat=46.8529&lng=-121.7604")
          echo "Rainier summit: HTTP $status $(cat rainier.json)"
          test "$status" = 200
          jq -e '.elevation > 4000 and (.suggestion.good | length) > 0' rainier.json
          curl -sS "$api/api/sites/near?lat=47.49&lng=-121.79&radius=40&limit=8" > near.json
          jq -c '.sites[] | {name, latitude, longitude, altitude, rated: ([["N",.windN],["NE",.windNe],["E",.windE],["SE",.windSe],["S",.windS],["SW",.windSw],["W",.windW],["NW",.windNw]] | map(select(.[1] > 0) | "\(.[0])=\(.[1])"))}' near.json |
            while read -r site; do
              echo "$site"
              lat=$(echo "$site" | jq -r .latitude); lng=$(echo "$site" | jq -r .longitude)
              echo "  terrain: $(curl -sS "$api/api/terrain?lat=$lat&lng=$lng" | jq -c '{elevation, suggestion}')"
            done

      # Site pages show the forecast's track record at the nearest airport.
      # Tiger's must come back from Renton or another airport with a year of
      # days; the first request builds it (Open-Meteo, the METAR archive).
      - name: Smoke test the forecast track record
        run: |
          status=$(curl -sS -m 90 -o record.json -w '%{http_code}' \
            "https://soarcast.mckinleyaviation.com/api/track-record?lat=47.4995&lng=-122.009")
          echo "HTTP $status"
          jq -c '{station: .record.station, distanceKm, from: .record.from, to: .record.to,
                  months: [.record.months[] | {month, days, rainForecastDays, rainSeenDays, rainBothDays}]}' record.json
          test "$status" = 200
          jq -e '([.record.months[].days] | add) > 200' record.json

      # Starting a sign-in writes to the database, so this catches a broken
      # database as well as a missing OAuth client id. Google is printed only.
      - name: Smoke test sign-in
        run: |
          for provider in github google; do
            curl -sS -o "signin-$provider.json" -w "%{http_code}" -X POST \
              -H 'content-type: application/json' -H 'origin: https://soarcast.mckinleyaviation.com' \
              -d "{\"provider\":\"$provider\",\"callbackURL\":\"/dashboard\"}" \
              https://soarcast.mckinleyaviation.com/api/auth/sign-in/social > "status-$provider.txt"
            echo "$provider: HTTP $(cat status-$provider.txt)"
            head -c 300 "signin-$provider.json"; echo
          done
          test "$(cat status-github.txt)" = 200
          grep -q 'github.com/login/oauth/authorize?' signin-github.json
          if grep -qE 'client_id=(undefined)?&' signin-github.json; then echo "No GitHub client id"; exit 1; fi

      # Informational: the same checks the hourly cron runs (and emails about).
      - name: Health report
        run: |
          curl -sS -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://soarcast.mckinleyaviation.com/api/health || true
          echo
