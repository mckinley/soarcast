name: Create D1 database

# One-off: creates the soarcast D1 database (if missing) and prints its id
# for wrangler.toml. Safe to re-run.
on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create or show the database
        run: npx wrangler d1 info soarcast || npx wrangler d1 create soarcast
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7c0ef4ee4d820ffe791557c534882957

      - name: List databases
        run: npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7c0ef4ee4d820ffe791557c534882957
