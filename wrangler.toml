name = "soarcast"
# McKinley Digital account. Pinned so every deploy, from CI or by hand, targets it.
account_id = "7c0ef4ee4d820ffe791557c534882957"
main = "./worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./build/client"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://soarcast.mckinleyaviation.com"

[[routes]]
pattern = "soarcast.mckinleyaviation.com"
custom_domain = true
