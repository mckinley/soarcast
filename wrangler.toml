name = "soarcast"
# McKinley Digital account. Pinned so every deploy, from CI or by hand, targets it.
account_id = "7c0ef4ee4d820ffe791557c534882957"
main = "./worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./build/client"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://soarcast.mckinleyaviation.com"

# The app database: users, favorites, settings and forecast caches.
# Migrations in migrations/ are applied by the deploy workflow.
[[d1_databases]]
binding = "DB"
database_name = "soarcast"
database_id = "e92d8ad3-7ca9-47aa-b26b-e2288ec3b963"
migrations_dir = "migrations"

# Alerts: hourly, so each user's morning and evening runs land at their local
# hour (worker.ts scheduled -> /api/notifications/check).
[triggers]
crons = ["0 * * * *"]

[[routes]]
pattern = "soarcast.mckinleyaviation.com"
custom_domain = true

# Syncing Pilots (live inReach and SPOT tracking, same account): how many
# pilots flew from a launch each day (app/lib/flown-days.server.ts). A
# Worker-to-Worker call, so there is no URL or key. Local dev runs without it.
[[services]]
binding = "SYNCING_PILOTS"
service = "syncing-pilots"
entrypoint = "FlownDaysApi"

# Cloudflare Email Sending (morning digest). Only the SoarCast address may send.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["soarcast@mckinleyaviation.com"]

# Workers Logs: console output and uncaught errors are kept and searchable in
# the Cloudflare dashboard (Workers & Pages > soarcast > Logs).
[observability]
enabled = true
