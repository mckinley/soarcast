name = "soarcast"
# McKinley Digital account. Pinned so every deploy, from CI or by hand, targets it.
account_id = "7c0ef4ee4d820ffe791557c534882957"
main = "./worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Run page requests next to the D1 database (eastern North America, no read
# replicas), so each query is a short hop instead of a cross-country round
# trip. Files under [assets] are still served from the nearest location.
[placement]
region = "aws:us-east-1"

[assets]
directory = "./build/client"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://soarcast.mckinleyaviation.com"

# The app database: users, favorites, settings and forecast caches.
# Migrations in migrations/ are applied by the deploy workflow.
[[d1_databases]]
binding = "DB"
database_name = "soarcast"
database_id = "e92d8ad3-7ca9-47aa-b26b-e2288ec3b963"
migrations_dir = "migrations"

# Alerts: hourly, so each user's morning and evening runs land at their local
# hour (worker.ts scheduled -> /api/notifications/check).
[triggers]
crons = ["0 * * * *"]

[[routes]]
pattern = "soarcast.mckinleyaviation.com"
custom_domain = true

# Syncing Pilots (live inReach and SPOT tracking, same account): how many
# pilots flew from a launch each day (app/lib/flown-days.server.ts). A
# Worker-to-Worker call, so there is no URL or key. Local dev runs without it.
[[services]]
binding = "SYNCING_PILOTS"
service = "syncing-pilots"
entrypoint = "FlownDaysApi"

# Cloudflare Email Sending (morning digest). Only the SoarCast address may send.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["soarcast@mckinleyaviation.com"]

# Workers Logs: console output and uncaught errors are kept and searchable in
# the Cloudflare dashboard (Workers & Pages > soarcast > Logs).
[observability]
enabled = true

# Which deploy is running (id and time), shown on /admin.
[version_metadata]
binding = "CF_VERSION_METADATA"


# Staging (docs/staging.md, pjmgmt's staging standard): a private copy with
# fake data at staging.soarcast.mckinleyaviation.com, behind the staging password,
# deployed by the Staging workflow (scripts/staging.mjs). Its own Worker and
# database; no email, no crons, no Syncing Pilots. It reads pgsites' staging
# copy over a service binding, so it never touches pgsites' production data.
# test/staging-config.test.mjs keeps it apart from production.
[env.staging]
name = "soarcast-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "staging.soarcast.mckinleyaviation.com", custom_domain = true }]

[env.staging.vars]
BETTER_AUTH_URL = "https://staging.soarcast.mckinleyaviation.com"
PGSITES_URL = "https://staging.pgsites.mckinleyaviation.com"
DEV_AUTH = "true"
APP_ENV = "staging"
# pjmgmt: allow-secret. The shared staging password (pjmgmt staging standard): it keeps strangers out of fake data, so it is config, not a secret.
STAGING_PASSWORD = "k3c8-w6vz-xekj-su76"

# scripts/staging.mjs fills in the id at deploy time
[[env.staging.d1_databases]]
binding = "DB"
database_name = "soarcast-staging-db"
database_id = "STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.staging.triggers]
crons = []

# pgsites' staging Worker, called directly with the staging password
# (src/lib/pgsites-client.ts)
[[env.staging.services]]
binding = "PGSITES"
service = "paragliding-sites-staging"

[env.staging.observability]
enabled = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"
