# SoarCast's background jobs (jobs/index.ts): the season build and the NOGA
# copy, each a Cloudflare Workflow. Its own Worker, so the site never loads
# the jobs' code. Deployed by the deploy workflow after the site.
name = "soarcast-jobs"
account_id = "7c0ef4ee4d820ffe791557c534882957"
main = "./index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
# No public URL: the cron and the Workflow are all it does
workers_dev = false

# Rating 20 years of days at a launch takes a few seconds of CPU per step
[limits]
cpu_ms = 300000

# The ERA5 reader's WebAssembly with 16 MB of memory instead of 64, written
# to jobs/.build before each build (run wrangler from the repository root)
[build]
command = "node jobs/shrink-wasm.mjs"
watch_dir = "../node_modules/@openmeteo/file-format-wasm/dist"

# The ERA5 reader fetches its WebAssembly at runtime; this hands it the
# bundled module instead (om-wasm.ts)
[alias]
"@openmeteo/file-format-wasm" = "./om-wasm.ts"

# The season build twice a day (a run that finds nothing due ends at once),
# the NOGA copy on Mondays. index.ts says which cron starts which.
[triggers]
crons = ["23 5,17 * * *", "41 4 * * 1"]

[[workflows]]
name = "season-build"
binding = "SEASON_BUILD"
class_name = "SeasonBuild"

[[workflows]]
name = "noga-sync"
binding = "NOGA_SYNC"
class_name = "NogaSync"

[[d1_databases]]
binding = "DB"
database_name = "soarcast"
database_id = "e92d8ad3-7ca9-47aa-b26b-e2288ec3b963"
migrations_dir = "../migrations"

# pgsites' database, read only: the listed launch each destination stands for
[[d1_databases]]
binding = "PGSITES"
database_name = "paragliding-sites"
database_id = "b7a6fb40-1aa2-4824-b589-2243c38487fc"

[observability]
enabled = true
